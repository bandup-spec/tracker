H.tCopy=function(el){copyText(el.dataset.pin);};
H.tNew=function(){
  openSheet('<div class="sh-h"><div><b>Add teacher</b><span>A 4-digit PIN is created for you</span></div><button class="x" data-act="closeSheet">×</button></div><label class="lbl">Teacher name</label><input class="inp" id="tnName" autocomplete="off"><div class="sh-f"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn green" data-act="tnSave">Add teacher</button></div>');
};
H.tnSave=function(){
  api('saveTeacher',{name:$('#tnName').value}).then(function(r){
    closeSheet();
    openSheet('<div class="sh-h"><div><b>Teacher added</b><span>Share this PIN with '+esc(r.name)+'</span></div><button class="x" data-act="closeSheet">×</button></div><div style="text-align:center;margin:18px 0"><div style="font-weight:700;margin-bottom:8px">'+esc(r.name)+'</div><span class="pin" style="font-size:34px;padding:8px 18px">'+esc(r.pin)+'</span></div><div class="sh-f"><button class="btn ghost" data-act="tCopy" data-pin="'+esc(r.pin)+'">Copy PIN</button><button class="btn green" data-act="closeSheet">Done</button></div>');
    VIEWS.teachers();
  }).catch(fail);
};
H.tRename=function(el){
  openSheet('<div class="sh-h"><div><b>Rename teacher</b></div><button class="x" data-act="closeSheet">×</button></div><input class="inp" id="trName" value="'+esc(el.dataset.name)+'"><div class="sh-f"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn green" data-act="trSave" data-id="'+esc(el.dataset.id)+'">Save</button></div>');
};
H.trSave=function(el){api('saveTeacher',{id:el.dataset.id,name:$('#trName').value}).then(function(){closeSheet();toast('Saved','ok');VIEWS.teachers();}).catch(fail);};
H.tReset=function(el){
  if(!confirm('Create a new PIN for '+el.dataset.name+'? Their old PIN will stop working.'))return;
  api('resetPin',{id:el.dataset.id}).then(function(r){
    openSheet('<div class="sh-h"><div><b>New PIN</b><span>'+esc(el.dataset.name)+'</span></div><button class="x" data-act="closeSheet">×</button></div><div style="text-align:center;margin:18px 0"><span class="pin" style="font-size:34px;padding:8px 18px">'+esc(r.pin)+'</span></div><div class="sh-f"><button class="btn ghost" data-act="tCopy" data-pin="'+esc(r.pin)+'">Copy PIN</button><button class="btn green" data-act="closeSheet">Done</button></div>');
    VIEWS.teachers();
  }).catch(fail);
};
H.tToggle=function(el){
  var on=el.dataset.on==='1';
  if(on&&!confirm('Deactivate '+el.dataset.name+'? They will no longer be able to sign in. Past records are kept.'))return;
  api('saveTeacher',{id:el.dataset.id,name:el.dataset.name,active:!on}).then(function(){toast(on?'Teacher deactivated':'Teacher activated','ok');VIEWS.teachers();}).catch(fail);
};
H.tBulk=function(){
  openSheet('<div class="sh-h"><div><b>Bulk import teachers</b><span>One name per line. PINs are created automatically.</span></div><button class="x" data-act="closeSheet">×</button></div><textarea class="inp" id="tbText" placeholder="Teacher Zeus&#10;Teacher Hera&#10;Teacher Apollo"></textarea><div id="tbOut"></div><div class="sh-f"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn green" data-act="tbGo">Import teachers</button></div>');
};
H.tbGo=function(){
  var names=$('#tbText').value.split(/\r?\n|,/).map(function(x){return x.trim();}).filter(Boolean);
  if(!names.length){toast('Type at least one name.','err');return;}
  api('bulkAddTeachers',{names:names}).then(function(r){
    var tsv=r.added.map(function(a){return a.name+'\t'+a.pin;}).join('\n');
    closeSheet();
    openSheet('<div class="sh-h"><div><b>Added '+r.added.length+' teacher'+(r.added.length===1?'':'s')+'</b><span>Share each PIN with its teacher</span></div><button class="x" data-act="closeSheet">×</button></div><div class="list">'+r.added.map(function(a){return '<div class="li"><b>'+esc(a.name)+'</b><span class="pin">'+esc(a.pin)+'</span></div>';}).join('')+r.skipped.map(function(x){return '<div class="li"><span>'+esc(x.name)+'</span><span class="chip c-OFF-TRACK">'+esc(x.reason)+'</span></div>';}).join('')+'</div><div class="sh-f"><button class="btn ghost" data-act="tCopy" data-pin="'+esc(tsv)+'">Copy list</button><button class="btn green" data-act="closeSheet">Done</button></div>');
    VIEWS.teachers();
  }).catch(fail);
};

/* ---------- Holidays ---------- */
VIEWS.cal=function(){
  var list=Object.keys(S.hol).sort().map(function(d){return S.hol[d];});
  var t=today();
  content('<div class="ph"><h2>Holidays and class changes</h2></div>'+
    '<div class="card"><div class="row2"><div><label class="lbl" style="margin-top:0">Date</label><input class="inp" type="date" id="hDate"></div><div><label class="lbl" style="margin-top:0">Name</label><input class="inp" id="hLabel" placeholder="e.g. National Heroes Day"></div></div>'+
    '<label class="lbl">What happens on this day?</label><select class="inp" id="hType"><option value="NO_CLASS">No class</option><option value="CLASS">Still have class</option></select>'+
    '<div class="sh-f"><button class="btn green" data-act="hSave" style="flex:none">Save day</button></div><div class="hint">Saturdays and Sundays never have class. Add a "Still have class" day to keep a holiday open for attendance.</div></div>'+
    '<div class="ph" style="margin-top:18px"><h2>Saved days</h2></div>'+
    (list.length?'<div class="card list">'+list.map(function(h){return '<div class="li" style="'+(h.date<t?'opacity:.6':'')+'"><div><b>'+longD(h.date)+', '+h.date.slice(0,4)+'</b><small>'+esc(h.label)+'</small></div><div class="acts"><span class="chip '+(h.type==='CLASS'?'c-ON-TRACK':'c-ARCH')+'">'+(h.type==='CLASS'?'Class':'No class')+'</span><button class="mini" data-act="hEdit" data-d="'+h.date+'">Edit</button><button class="mini" data-act="hDel" data-d="'+h.date+'">Remove</button></div></div>';}).join('')+'</div>':'<div class="card empty"><b>No holidays saved</b>Every weekday is a class day until you add one here.</div>'));
};
H.hSave=function(){
  var d=$('#hDate').value;if(!d){toast('Pick a date.','err');return;}
  api('saveHoliday',{date:d,label:$('#hLabel').value,type:$('#hType').value}).then(function(l){setHol(l);toast('Saved','ok');VIEWS.cal();}).catch(fail);
};
H.hEdit=function(el){var h=S.hol[el.dataset.d];$('#hDate').value=h.date;$('#hLabel').value=h.label;$('#hType').value=h.type;window.scrollTo(0,0);};
H.hDel=function(el){if(!confirm('Remove this day from the list?'))return;api('deleteHoliday',{date:el.dataset.d}).then(function(l){setHol(l);VIEWS.cal();}).catch(fail);};

/* ---------- Reports ---------- */
var RP={mode:'all',sel:{},q:'',details:true,from:'',to:'',out:null};
VIEWS.reports=function(){
  if(!RP.from){RP.from=monthStart(today());RP.to=today();}
  loadList().then(drawReports).catch(fail);
};
function rpChecks(){
  var q=RP.q.trim().toLowerCase();
  var l=S.list.students.filter(function(s){return s.active&&(!q||s.name.toLowerCase().indexOf(q)>-1);});
  return l.map(function(s){var on=RP.sel[s.id];return '<div class="prow'+(on?' on':'')+'" data-act="rpTog" data-id="'+esc(s.id)+'"><i>'+(on?'✓':'')+'</i><span>'+esc(s.name)+'</span><small>'+COURSE[s.course]+(s.type==='CAMP'?' · Camp':'')+'</small></div>';}).join('')||'<div class="empty">No students.</div>';
}
function drawReports(){
  content('<div class="ph"><h2>Reports</h2></div><div class="card">'+
    '<label class="lbl" style="margin-top:0">Who is in the report?</label><div class="seg"><button data-act="rpMode" data-m="all" class="'+(RP.mode==='all'?'on':'')+'">All active students</button><button data-act="rpMode" data-m="sel" class="'+(RP.mode==='sel'?'on':'')+'">Choose students</button></div>'+
    (RP.mode==='sel'?'<input class="search" style="margin-top:10px" data-in="rpq" placeholder="Search student\'s name" value="'+esc(RP.q)+'"><div class="chk" id="rpChk">'+rpChecks()+'</div><div class="hint" id="rpCnt">'+Object.keys(RP.sel).length+' selected</div>':'')+
    '<label class="sw" style="margin-bottom:0"><input type="checkbox" id="rpDet" data-ch="rpdet"'+(RP.details?' checked':'')+'> Include the daily attendance log</label>'+
    '<div class="row2" id="rpDates" style="'+(RP.details?'':'display:none')+'"><div><label class="lbl">Log from</label><input class="inp" type="date" id="rpFrom" data-ch="rpd" value="'+RP.from+'"></div><div><label class="lbl">Log to</label><input class="inp" type="date" id="rpTo" data-ch="rpd" value="'+RP.to+'"></div></div>'+
    '<div class="hint">Eligibility and remarks always use the whole course so far. The date range only limits the daily log.</div>'+
    '<div class="sh-f" style="flex-wrap:wrap"><button class="btn ghost" data-act="rpGo">Preview</button><button class="btn ghost" data-act="rpPrint">Print / Save PDF</button><button class="btn green" data-act="rpSheet">'+(API_URL?'Download CSV':'Save to Google Sheets')+'</button></div></div><div id="rpOut"></div>');
  if(RP.out)$('#rpOut').innerHTML='<div class="rep">'+reportHtml(RP.out)+'</div>';
}
H.rpMode=function(el){RP.mode=el.dataset.m;drawReports();};
H.rpTog=function(el){var id=el.dataset.id;if(RP.sel[id])delete RP.sel[id];else RP.sel[id]=1;$('#rpChk').innerHTML=rpChecks();$('#rpCnt').textContent=Object.keys(RP.sel).length+' selected';};
IN.rpq=function(el){RP.q=el.value;$('#rpChk').innerHTML=rpChecks();};
CH.rpdet=function(el){RP.details=el.checked;$('#rpDates').style.display=RP.details?'':'none';};
CH.rpd=function(){RP.from=$('#rpFrom').value;RP.to=$('#rpTo').value;};
function rpPayload(){
  if(RP.mode==='sel'&&!Object.keys(RP.sel).length){toast('Choose at least one student.','err');return null;}
  RP.from=($('#rpFrom')||{}).value||RP.from;RP.to=($('#rpTo')||{}).value||RP.to;
  return {ids:RP.mode==='sel'?Object.keys(RP.sel):[],details:RP.details,from:RP.from,to:RP.to};
}
function rpFetch(){var p=rpPayload();if(!p)return Promise.reject({message:'Choose at least one student.'});return api('report',p).then(function(d){RP.out=d;$('#rpOut').innerHTML='<div class="rep">'+reportHtml(d)+'</div>';return d;});}
H.rpGo=function(){rpFetch().catch(fail);};
H.rpPrint=function(){rpFetch().then(function(d){printHtml(reportHtml(d));}).catch(fail);};
H.rpSheet=function(){
  var p=rpPayload();if(!p)return;
  api('exportReport',p).then(function(r){
    if(r.csv){
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.csv],{type:'text/csv;charset=utf-8'}));a.download=r.name;
      document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast('Report downloaded','ok');return;
    }
    openSheet('<div class="sh-h"><div><b>Report saved</b><span>A new Google Sheet was created in your Drive</span></div><button class="x" data-act="closeSheet">×</button></div><p style="word-break:break-word">'+esc(r.name)+'</p><div class="sh-f"><button class="btn ghost" data-act="closeSheet">Close</button><a class="btn green" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+esc(r.url)+'" target="_blank" rel="noopener">Open in Google Sheets</a></div>');
  }).catch(fail);
};
function reportHtml(d){
  var o='<div class="pr"><h2>'+esc(d.org)+' · Attendance Report</h2><p>Generated '+esc(d.generatedAt)+' · '+d.items.length+' student'+(d.items.length===1?'':'s')+' · '+esc(d.lateNote||(d.lateAbsent?'Late counts as absent':'Late counts as present'))+'</p>';
  if(!d.items.length)return o+'<div class="empty">No students match.</div></div>';
  o+='<table class="rt"><tr><th>#</th><th>Student</th><th>Course</th><th>Start – End</th><th>Attended / Required hrs</th><th>Absent hrs</th><th>Allowed</th><th>Left</th><th>Status</th><th>Certificate</th><th>Remarks</th></tr>'+
    d.items.map(function(it,i){var s=it.student,t=it.stats;
      return '<tr><td class="n">'+(i+1)+'</td><td><b>'+esc(s.name)+'</b></td><td>'+COURSE[s.course]+'<br>'+s.weeks+' wk'+(s.weeks>1?'s':'')+'</td><td>'+mdy(s.start)+'<br>'+mdy(s.end)+'</td><td class="n">'+t.attended+' / '+t.required+'</td><td class="n">'+t.absent+'</td><td class="n">'+t.allowed+'</td><td class="n">'+t.remaining+'</td><td>'+chip(t.status)+'</td><td>'+chip(t.status,t.cert||'PENDING')+'</td><td>'+esc(it.remark)+'</td></tr>';}).join('')+'</table>';
  if(d.details){
    o+='<h3 style="margin-top:22px">Daily attendance log'+(d.from||d.to?' · '+(d.from?mdy(d.from):'start')+' to '+(d.to?mdy(d.to):'today'):'')+'</h3>';
    d.items.forEach(function(it){
      var m={},ds={};(it.log||[]).forEach(function(x){m[x[0]+'|'+x[1]]=x[2];ds[x[0]]=1;});
      var dates=Object.keys(ds).sort();
      o+='<div class="pr-sec"><h3>'+esc(it.student.name)+'</h3>'+(dates.length?recTable(dates,function(dd,h){return m[dd+'|'+h];},false):'<p>No attendance recorded in this range.</p>')+'</div>';
    });
    o+=legend();
  }
  return o+'</div>';
}

/* ---------- Settings ---------- */
VIEWS.settings=function(){
  api('getSettings').then(function(s){
    content('<div class="ph"><h2>Settings</h2></div><div class="card"><label class="lbl" style="margin-top:0">School name</label><input class="inp" id="seOrg" value="'+esc(s.org)+'">'+
      '<label class="sw"><input type="checkbox" id="seLate" data-ch="seLateMode"'+(s.lateAbsent?' checked':'')+'> Count every Late (L) hour as absent</label><div class="hint" style="margin-top:-8px">Off by default: Late and Excused both count as present.</div>'+
      '<label class="sw"><input type="checkbox" id="seLate3" data-ch="seLateMode"'+(s.lateThree&&!s.lateAbsent?' checked':'')+'> Every 3 Late (L) hours count as 1 absent hour</label><div class="hint" style="margin-top:-8px">Counted over the whole course. For example, 7 lates = 2 absent hours. Only one of these two late options can be on at a time.</div>'+
      '<label class="sw"><input type="checkbox" id="seCamp"'+(s.camp?' checked':'')+'> Camp season</label><div class="hint" style="margin-top:-8px">Adds the 7AM, 12NN and 5PM slots and a Saturday column to every schedule and attendance grid. While it is on, 12NN is a class slot instead of the lunch break. Turning it off only hides them. Nothing is deleted.</div>'+
      '<div class="sh-f"><button class="btn green" data-act="seSave" style="flex:none">Save settings</button></div></div>'+
      '<div class="ph" style="margin-top:18px"><h2>Change admin password</h2></div><div class="card"><label class="lbl" style="margin-top:0">Current password</label><input class="inp" type="password" id="pwOld" autocomplete="off"><label class="lbl">New password</label><input class="inp" type="password" id="pwNew" autocomplete="off"><div class="sh-f"><button class="btn green" data-act="pwSave" style="flex:none">Change password</button></div><div class="hint">The first password is "admin". Please change it.</div></div>'+
      '<div class="ph" style="margin-top:18px"><h2>Certificate policy</h2></div><div class="card"><div class="tw"><table class="rt" style="min-width:0"><tr><th>Course</th><th>Hours per week</th><th>Absent hours allowed per week</th></tr><tr><td>Standard (4 man-to-man + 2 group)</td><td class="n">30</td><td class="n">6</td></tr><tr><td>Intensive (7 man-to-man)</td><td class="n">35</td><td class="n">7</td></tr></table></div><div class="hint">Allowed absences = weeks of stay × the weekly allowance. A student is not eligible once absent hours go over the allowance. At risk starts at 75% used. Holidays marked "No class" never count as absences.</div></div>');
  }).catch(fail);
};
CH.seLateMode=function(el){
  var a=$('#seLate'),b=$('#seLate3');
  if(el.checked){(el===a?b:a).checked=false;}
};
H.seSave=function(){api('saveSettings',{org:$('#seOrg').value,lateAbsent:$('#seLate').checked,lateThree:$('#seLate3').checked,camp:$('#seCamp').checked}).then(function(s){S.boot.camp=s.camp;S.boot.org=s.org;S.boot.lateAbsent=s.lateAbsent;S.boot.lateThree=s.lateThree;S.list=null;toast('Settings saved','ok');var b=$('.brand small');if(b)b.textContent=s.org;}).catch(fail);};
H.pwSave=function(){api('saveSettings',{currentPassword:$('#pwOld').value,newPassword:$('#pwNew').value}).then(function(){$('#pwOld').value='';$('#pwNew').value='';toast('Password changed','ok');}).catch(fail);};

start();
})();
</script>
