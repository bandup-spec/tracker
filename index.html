<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f7a">
<link rel="icon" type="image/png" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<title>CWA Attendance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" role="status" aria-live="polite"><div class="sp-card"><img class="sp-logo" src="logo.png" alt="Curious World Academy"><div class="sp-sub">Attendance &amp; Lesson Tracker</div><div class="sp-bar"><i></i></div><div class="sp-note" id="spNote"></div></div></div>
<div id="busy"></div>
<div id="app"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
/* index.html: login, session restore, and loading the signed-in role's module (admin.html or teacher.html). */
(function(C){
'use strict';
var S=C.S,H=C.H,CH=C.CH,$=C.$,app=C.app,api=C.api,esc=C.esc,fail=C.fail;
var loadedRole=null;

/* splash: stays at least ~1s (no flash), says so if the server is slow to wake, and always goes away eventually */
var splashT0=Date.now(),splashDone=false;
var splashTimers=[setTimeout(function(){note('Loading…');},4000),setTimeout(function(){note('Waking up the server. This can take a few seconds…');},8000),setTimeout(hideSplash,20000)];
function note(t){var n=document.getElementById('spNote');if(n){n.textContent=t;n.classList.add('on');}}
function hideSplash(){
  var s=document.getElementById('splash');if(!s||splashDone)return;splashDone=true;
  splashTimers.forEach(clearTimeout);
  setTimeout(function(){s.classList.add('out');setTimeout(function(){s.remove();},450);},Math.max(0,1000-(Date.now()-splashT0)));
}

function showLogin(msg){
  S.token=null;S.user=null;C.closeAllSheets();
  app.innerHTML='<div class="login-wrap"><div class="login-card"><div class="login-tag">CWA ATTENDANCE TRACKER</div><img class="login-logo" src="logo-192.png" alt=""><h1>LOGIN</h1>'+
    '<div class="fld"><select id="lu" data-ch="lmode"><option>Loading…</option></select></div>'+
    '<div class="fld"><label id="ll">PIN</label><input id="lp" type="password" autocomplete="off" inputmode="numeric" maxlength="4"></div>'+
    '<div class="lerr" id="le">'+esc(msg||'')+'</div>'+
    '<button class="btn green block" data-act="doLogin">SIGN IN</button></div></div>';
  api('loginOptions').then(function(list){
    var last='';try{last=localStorage.getItem('cwa_user')||'';}catch(e){}
    $('#lu').innerHTML=list.map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===last?' selected':'')+'>'+esc(o.name)+'</option>';}).join('');
    loginMode();hideSplash();
  }).catch(function(e){hideSplash();fail(e);});
}
function loginMode(){
  var admin=$('#lu').value==='ADMIN',p=$('#lp');
  $('#ll').textContent=admin?'PASSWORD':'PIN';
  if(admin){p.removeAttribute('maxlength');p.setAttribute('inputmode','text');}
  else{p.setAttribute('maxlength','4');p.setAttribute('inputmode','numeric');}
  p.value='';
}
CH.lmode=function(){loginMode();$('#le').textContent='';};
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='lp')H.doLogin();});

H.doLogin=function(){
  var u=$('#lu').value,p=$('#lp').value;
  if(!p){$('#le').textContent='Enter your '+(u==='ADMIN'?'password':'4-digit PIN')+'.';return;}
  api('login',{userId:u,pin:p}).then(function(r){
    S.token=r.token;try{localStorage.setItem('cwa_token',r.token);localStorage.setItem('cwa_user',u);}catch(e){}
    return api('bootstrap');
  }).then(enter).catch(function(e){
    console.error('[cwa] login flow',e);
    var el=$('#le');if(el&&!e.auth)el.textContent=e.message;else fail(e);
  });
};
function forceLogout(msg){try{localStorage.removeItem('cwa_token');}catch(e){}showLogin(msg);}
H.logout=function(){api('logout').catch(function(){});forceLogout();};
C.showLogin=forceLogout;

/* Lesson Trackers: code is fetched the first time it is opened (both roles) */
function loadJs(src){return new Promise(function(res,rej){var el=document.createElement('script');el.src=src;el.onload=res;el.onerror=function(){rej(new Error('Could not load '+src));};document.head.appendChild(el);});}
function lessonReady(){return C.lesson?Promise.resolve():loadJs('lesson.js');}
H.lessonOpen=function(){lessonReady().then(function(){C.lesson.open();}).catch(fail);};
H.lsBooks=function(){lessonReady().then(function(){C.lesson.books();}).catch(fail);};

/* the role's script registers C.render and C.mount */
function loadModule(role){
  if(loadedRole===role)return Promise.resolve();
  return loadJs(role==='admin'?'admin.js':'teacher.js').then(function(){loadedRole=role;});
}
function enter(b){
  C.setBoot(b);
  app.innerHTML=C.skel(b.user.role==='admin'?'admin':'week');   /* placeholder while the screen's code loads */
  hideSplash();
  return loadModule(b.user.role).then(function(){
    if(typeof C.mount!=='function')throw new Error('The '+b.user.role+' module loaded but did not define mount().');
    C.mount();
  });
}
function start(){
  var t=null;try{t=localStorage.getItem('cwa_token');}catch(e){}
  if(!t){showLogin();return;}
  S.token=t;
  api('bootstrap').then(enter).catch(function(e){console.error('[cwa] start',e);showLogin(e&&e.auth?'':(e&&e.message)||'');});
}
start();
})(window.CWA);
</script>
</body>
</html>
